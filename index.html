<h1>islands (multiplayer soon!!)</h1>
<table id="board"></table>
<p id="status">current player: red | red islands: 0 | blue islands: 0</p>
<button id="retryBtn">retry</button> <!-- new retry button -->

<script>
const size = 6;
let board = Array(size).fill(null).map(() => Array(size).fill(''));
let currentPlayer = 'red';

const table = document.getElementById('board');
const retryBtn = document.getElementById('retryBtn');

function createBoard() {
  table.innerHTML = '';
  for (let i = 0; i < size; i++) {
    let row = table.insertRow();
    for (let j = 0; j < size; j++) {
      let cell = row.insertCell();
      cell.className = board[i][j];
      cell.addEventListener('click', () => makeMove(i,j));
      cell.textContent = '';
    }
  }
  updateStatus();
}

function countIslands(player) {
  return board.flat().filter(c => c === player).length;
}

function isValidMove(i,j) {
  if (board[i][j] !== '') return false;
  if (!board.flat().some(x => x === currentPlayer)) return true; // first move anywhere
  const dirs = [[0,1],[1,0],[0,-1],[-1,0]];
  return dirs.some(([di,dj]) => {
    let ni = i + di, nj = j + dj;
    return ni >=0 && ni<size && nj>=0 && nj<size && board[ni][nj] === currentPlayer;
  });
}

function makeMove(i,j) {
  if (!isValidMove(i,j)) return;
  board[i][j] = currentPlayer;
  currentPlayer = currentPlayer === 'red' ? 'blue' : 'red';
  createBoard();
  checkEndGame();
}

function updateStatus() {
  const redCount = countIslands('red');
  const blueCount = countIslands('blue');
  document.getElementById('status').textContent = 
    `current player: ${currentPlayer} | red islands: ${redCount} | blue islands: ${blueCount}`;
}

function checkEndGame() {
  const movesLeft = board.flat().some((cell, idx) => {
    let i = Math.floor(idx/size), j = idx%size;
    return isValidMove(i,j);
  });
  if (!movesLeft) {
    const redCount = countIslands('red');
    const blueCount = countIslands('blue');
    document.getElementById('status').textContent =
      redCount === blueCount ? 
      `tie! red: ${redCount}, blue: ${blueCount}` :
      `winner: ${redCount > blueCount ? 'red' : 'blue'} (red: ${redCount}, blue: ${blueCount})`;
  }
}

// **retry button resets the game**
retryBtn.addEventListener('click', () => {
  board = Array(size).fill(null).map(() => Array(size).fill(''));
  currentPlayer = 'red';
  createBoard();
});

createBoard();
</script>
